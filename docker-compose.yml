# One stack per transport, so each strategy runs against its own database with only
# what it needs: `table` and `cursor` run a plain Postgres, `wal` and `journal` run one
# with wal_level=logical. Every stack is postgres-<mode> + pgbouncer-<mode> (transaction
# mode) + outbox-<mode> (the publisher) + producer-<mode>. Nothing is published on host ports.
#
# There is no Pub/Sub emulator: the relays default to a simulated sink that costs a fixed
# latency per publish batch, and can publish to a real Pub/Sub project when configured
# (RELAY_SINK=pubsub, PUBSUB_PROJECT_ID, GOOGLE_APPLICATION_CREDENTIALS).
#
#   docker compose up -d                           # the four databases and their poolers
#   docker compose --profile bench build           # relay, producer and consumer images
#   docker compose run --rm outbox-cursor &         # the publisher for one strategy ...
#   docker compose run --rm producer-cursor -events 10000 -workers 16   # ... and its load
#   bench/run.sh                                   # full benchmark across all four

x-postgres: &postgres
  image: postgres:18
  environment:
    POSTGRES_USER: outbox
    POSTGRES_PASSWORD: outbox
    POSTGRES_DB: outbox
  shm_size: 256mb
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U outbox -d outbox"]
    interval: 2s
    timeout: 2s
    retries: 30

# A plain Postgres: what the table and cursor transports need. pg_stat_statements is
# loaded everywhere so the benchmark can attribute database work to each statement.
x-postgres-plain-command: &postgres_plain_command
  - postgres
  - -c
  - max_connections=300
  - -c
  - shared_buffers=512MB
  - -c
  - shared_preload_libraries=pg_stat_statements

# Logical decoding on: what the log-message transports need. max_slot_wal_keep_size
# caps WAL retained by a lagging slot so the prototype shows slot invalidation rather
# than filling the disk; raise or remove in real use.
x-postgres-logical-command: &postgres_logical_command
  - postgres
  - -c
  - wal_level=logical
  - -c
  - max_replication_slots=8
  - -c
  - max_wal_senders=8
  - -c
  - max_connections=300
  - -c
  - shared_buffers=512MB
  - -c
  - max_slot_wal_keep_size=2GB
  - -c
  - shared_preload_libraries=pg_stat_statements

# Transaction-mode pooler in front of each Postgres. Producers always go through it to
# prove the transports work without session state; so does the cursor relay. The
# log-message relays bypass it: replication connections cannot go through PgBouncer.
x-pgbouncer: &pgbouncer
  image: edoburu/pgbouncer:latest
  environment: &pgbouncer_env
    DB_PORT: 5432
    DB_USER: outbox
    DB_PASSWORD: outbox
    DB_NAME: outbox
    POOL_MODE: transaction
    AUTH_TYPE: scram-sha-256
    MAX_CLIENT_CONN: 1000
    DEFAULT_POOL_SIZE: 64

# The Go services carry the `bench` profile so a plain `docker compose up` starts only
# the databases; `docker compose run` targets them directly.
x-outbox: &outbox
  build: ./relay
  profiles: [bench]
  environment: &outbox_env
    RELAY_TARGET: target_1
    # simulated (default) costs RELAY_SINK_LATENCY per publish batch and sends nothing.
    RELAY_SINK: simulated
    RELAY_SINK_LATENCY: 200ms

x-producer: &producer
  build: ./producer
  profiles: [bench]

services:
  # ---- table: the conventional outbox, insert then delete ---------------------------
  postgres-table:
    <<: *postgres
    command: *postgres_plain_command
    volumes:
      - ./postgres/00-common.sql:/docker-entrypoint-initdb.d/00-common.sql:ro
      - ./postgres/10-table.sql:/docker-entrypoint-initdb.d/10-table.sql:ro
  pgbouncer-table:
    <<: *pgbouncer
    environment: { <<: *pgbouncer_env, DB_HOST: postgres-table }
    depends_on: { postgres-table: { condition: service_healthy } }
  outbox-table:
    <<: *outbox
    command: ["/tablerelay"]
    environment: { <<: *outbox_env, RELAY_DSN: "postgres://outbox:outbox@postgres-table:5432/outbox" }
    depends_on: { postgres-table: { condition: service_healthy } }
  producer-table:
    <<: *producer
    environment: { PRODUCER_DSN: "postgres://outbox:outbox@pgbouncer-table:5432/outbox", OUTBOX_MODE: table, OUTBOX_TARGETS: target_1 }
    depends_on: [pgbouncer-table]

  # ---- wal: pg_logical_emit_message, no table ----------------------------------------
  postgres-wal:
    <<: *postgres
    command: *postgres_logical_command
    volumes:
      - ./postgres/00-common.sql:/docker-entrypoint-initdb.d/00-common.sql:ro
      - ./postgres/10-publication.sql:/docker-entrypoint-initdb.d/10-publication.sql:ro
  pgbouncer-wal:
    <<: *pgbouncer
    environment: { <<: *pgbouncer_env, DB_HOST: postgres-wal }
    depends_on: { postgres-wal: { condition: service_healthy } }
  outbox-wal:
    <<: *outbox
    command: ["/relay"]
    environment:
      <<: *outbox_env
      RELAY_DSN: postgres://outbox:outbox@postgres-wal:5432/outbox?replication=database
      RELAY_STATE_DIR: /state
    volumes: ["./state/wal:/state"]
    depends_on: { postgres-wal: { condition: service_healthy } }
  producer-wal:
    <<: *producer
    environment: { PRODUCER_DSN: "postgres://outbox:outbox@pgbouncer-wal:5432/outbox", OUTBOX_MODE: wal, OUTBOX_TARGETS: target_1 }
    depends_on: [pgbouncer-wal]

  # ---- journal: wal plus an append-only journal for slot-loss recovery ---------------
  postgres-journal:
    <<: *postgres
    command: *postgres_logical_command
    volumes:
      - ./postgres/00-common.sql:/docker-entrypoint-initdb.d/00-common.sql:ro
      - ./postgres/10-publication.sql:/docker-entrypoint-initdb.d/10-publication.sql:ro
      - ./postgres/20-journal.sql:/docker-entrypoint-initdb.d/20-journal.sql:ro
  pgbouncer-journal:
    <<: *pgbouncer
    environment: { <<: *pgbouncer_env, DB_HOST: postgres-journal }
    depends_on: { postgres-journal: { condition: service_healthy } }
  outbox-journal:
    <<: *outbox
    command: ["/relay"]
    environment:
      <<: *outbox_env
      RELAY_DSN: postgres://outbox:outbox@postgres-journal:5432/outbox?replication=database
      RELAY_JOURNAL: "true"
      RELAY_JOURNAL_DSN: postgres://outbox:outbox@postgres-journal:5432/outbox
      RELAY_STATE_DIR: /state
    volumes: ["./state/journal:/state"]
    depends_on: { postgres-journal: { condition: service_healthy } }
  producer-journal:
    <<: *producer
    environment: { PRODUCER_DSN: "postgres://outbox:outbox@pgbouncer-journal:5432/outbox", OUTBOX_MODE: journal, OUTBOX_TARGETS: target_1 }
    depends_on: [pgbouncer-journal]

  # ---- cursor: append-only table read by per-shard cursors, plain Postgres -----------
  postgres-cursor:
    <<: *postgres
    command: *postgres_plain_command
    volumes:
      - ./postgres/00-common.sql:/docker-entrypoint-initdb.d/00-common.sql:ro
      - ./postgres/10-cursor.sql:/docker-entrypoint-initdb.d/10-cursor.sql:ro
  pgbouncer-cursor:
    <<: *pgbouncer
    environment: { <<: *pgbouncer_env, DB_HOST: postgres-cursor }
    depends_on: { postgres-cursor: { condition: service_healthy } }
  outbox-cursor:
    <<: *outbox
    command: ["/cursorrelay"]
    # Through the pooler: every poll is one transaction. Run several for replicas.
    environment: { <<: *outbox_env, RELAY_DSN: "postgres://outbox:outbox@pgbouncer-cursor:5432/outbox", RELAY_WORKERS: "8" }
    depends_on: [pgbouncer-cursor]
  producer-cursor:
    <<: *producer
    environment: { PRODUCER_DSN: "postgres://outbox:outbox@pgbouncer-cursor:5432/outbox", OUTBOX_MODE: cursor, OUTBOX_TARGETS: target_1 }
    depends_on: [pgbouncer-cursor]

  # Only useful against a real Pub/Sub project (there is no emulator in this stack):
  # set PUBSUB_PROJECT_ID and mount credentials.
  consumer:
    build: ./consumer
    profiles: [bench]
    environment:
      RELAY_TARGET: target_1
