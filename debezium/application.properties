# Debezium Server for the `debezium` transport: decode inserts into outbox_events from
# the write-ahead log, route each row to its target's topic, publish.
#
# Any property can be overridden from the environment (DEBEZIUM_SINK_TYPE=pubsub,
# DEBEZIUM_SINK_PUBSUB_PROJECT_ID=...), which is how the compose file switches sinks.

# ---- source: Postgres over pgoutput ----------------------------------------------
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=postgres-debezium
debezium.source.database.port=5432
debezium.source.database.user=outbox
debezium.source.database.password=outbox
debezium.source.database.dbname=outbox
debezium.source.topic.prefix=outbox
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=outbox_debezium
# The publication is created by the schema (inserts only, published via the partition
# root), never by the connector.
debezium.source.publication.name=outbox_pub
debezium.source.publication.autocreate.mode=disabled
debezium.source.table.include.list=public.outbox_events
# Schema only on first start: an outbox never wants its history snapshotted.
debezium.source.snapshot.mode=no_data
debezium.source.tombstones.on.delete=false
debezium.source.max.batch.size=2048
debezium.source.max.queue.size=16384
# Heartbeats keep the slot moving while the outbox is idle on a busy database. Off for
# the benchmark so that the sink counts only events; set to e.g. 10000 in real use.
debezium.source.heartbeat.interval.ms=0

# ---- progress: the offset store -----------------------------------------------------
# A file on a volume, flushed after every batch the sink has confirmed. In real use
# point this at Redis or a JDBC store instead.
debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=0

# ---- outbox routing -----------------------------------------------------------------
# One row = one message. `target` picks the topic, `key` is the ordering key, `payload`
# is the body, `id` travels as a header for consumer dedupe.
debezium.source.transforms=outbox
debezium.source.transforms.outbox.type=io.debezium.transforms.outbox.EventRouter
debezium.source.transforms.outbox.route.by.field=target
debezium.source.transforms.outbox.route.topic.replacement=outbox-\\${routedByValue}
debezium.source.transforms.outbox.table.field.event.id=id
debezium.source.transforms.outbox.table.field.event.key=key
debezium.source.transforms.outbox.table.field.event.payload=payload
debezium.source.transforms.outbox.table.expand.json.payload=true
debezium.source.transforms.outbox.table.fields.additional.placement=target:header

debezium.format.key=simplestring
debezium.format.value=json
debezium.format.value.schemas.enable=false
debezium.format.header=json

# ---- sink -----------------------------------------------------------------------------
# http: the benchmark's simulated Pub/Sub, a counter that charges a fixed latency per
# batch. pubsub: the real thing; set DEBEZIUM_SINK_TYPE=pubsub and the project id.
debezium.sink.type=http
debezium.sink.http.url=http://sink-debezium:8080/publish
debezium.sink.http.batch.enabled=true
debezium.sink.http.batch.max-size=1000
debezium.sink.http.timeout.ms=60000
debezium.sink.http.retries=5
debezium.sink.http.retry.interval.ms=1000

debezium.sink.pubsub.ordering.enabled=true
debezium.sink.pubsub.batch.element.count.threshold=1000
debezium.sink.pubsub.batch.delay.threshold.ms=50

quarkus.log.level=INFO
quarkus.log.console.json=false
quarkus.http.port=8080
